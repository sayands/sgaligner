# Note: PyTorch and related packages with CUDA support should be installed separately
# with the appropriate CUDA version. For example:
# - Install PyTorch with CUDA support: pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu121
# - Install torch-geometric extensions: pyg-lib, torch-cluster, torch-scatter, torch-sparse, torch-spline-conv
#   These may need to be installed from source or via conda with CUDA support.

[project]
name = "sgaligner"
version = "1.0.0"
description = "SGAligner: 3D Scene Alignment with Scene Graphs"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}

dependencies = [
    "addict>=2.4.0",
    "coloredlogs>=15.0.1",
    "ConfigArgParse>=1.7.0",
    "easydict>=1.13",
    "einops>=0.8.0",
    "matplotlib>=3.10.0",
    "numpy==1.26.4",
    "opencv-python==4.11.0.86",
    "open3d>=0.19.0",
    "plyfile>=1.1.0",
    "pointnet2-ops>=3.0.0",
    "pyquaternion>=0.9.9",
    "PyYAML>=6.0.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.0",
    "tensorboard>=2.20.0",
    "torch-geometric>=2.7.0",
    "torchsummary>=1.5.0",
    "tqdm>=4.67.0",
    "trimesh>=3.17.0",
    "yacs>=0.1.8",
    "ipdb>=0.13.0",
    "pygcransac>=0.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]
jupyter = [
    "ipython>=9.9.0",
    "ipykernel>=6.0.0",
    "ipywidgets>=8.1.0",
    "jupyter>=1.0.0",
]
visualization = [
    "dash>=3.4.0",
    "plotly>=6.5.0",
]
config = [
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project.urls]
Homepage = "https://sayands.github.io/sgaligner"
Repository = "https://github.com/sayands/sgaligner"
